name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway-start.sh", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
env:
  UPSTREAM_REF: 527e7c437ad52105f5aad9ff2316367dead10168
  VERSION: 0.6.1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PlantCraft/PlantCraft
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Base image (upstream Dockerfile, unmodified)
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.UPSTREAM_REF }}
          labels: org.opencontainers.image.source=https://github.com/onepush-dev/plantcraft
          tags: ghcr.io/onepush-dev/plantcraft-base:0.6.1
      - name: Railway image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/onepush-dev/plantcraft:0.6.1
